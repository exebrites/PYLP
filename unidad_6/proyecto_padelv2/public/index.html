<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de jugadores</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <h1>Gestión de jugadores de pádel</h1>

  <p id="estado" role="status" aria-live="polite">
    Comprobando sesión…
  </p>

  <section id="acceso" hidden>
    <h2>Acceso</h2>

    <form id="form-acceso">
      <div>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>

      <br>

      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>

      <br>

      <button type="submit" id="btn-ingresar">
        Iniciar sesión
      </button>

      <button type="button" id="btn-registrar">
        Crear cuenta
      </button>
    </form>
  </section>

  <section id="panel" hidden>
    <h2>Panel de jugadores</h2>

    <p>
      Sesión iniciada como:
      <span id="usuario-email"></span>
    </p>

    <button type="button" id="btn-salir">
      Cerrar sesión
    </button>


    <hr>

    <h3>Registrar jugador</h3>

    <form id="form-jugador">
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" maxlength="80" required>
      </div>

      <br>

      <div>
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" maxlength="80" required>
      </div>

      <br>

      <div>
        <label for="lado">Lado de juego</label>
        <select id="lado" required>
          <option value="">Seleccionar…</option>
          <option value="Drive">Drive</option>
          <option value="Revés">Revés</option>
        </select>
      </div>

      <br>

      <button type="submit" id="btn-guardar">
        Guardar jugador
      </button>
      <button type="button" id="btn-cancelar" hidden>
        Cancelar edición
      </button>
    </form>

    <p id="mensaje-jugador" role="status" aria-live="polite"></p>
    <hr>

    <h3>Mis jugadores</h3>

    <p id="estado-listado" role="status" aria-live="polite"></p>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Apellido</th>
            <th scope="col">Lado</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>

        <tbody id="tabla-jugadores"></tbody>
      </table>
    </div>
  </section>

  <script type="module" src="./js/app.js"></script>
</body>

</html>
